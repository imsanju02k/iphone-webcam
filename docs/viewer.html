<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iPhone WebCam – Viewer</title>
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; background:#000; overflow:hidden; }

    #video {
      width:100%; height:100%;
      object-fit:contain;
      display:block; background:#000;
    }

    #overlay {
      position:fixed; inset:0; background:#000;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:14px; transition:opacity 0.4s ease;
      z-index: 10;
    }
    #overlay.hidden { opacity:0; pointer-events:none; }

    .spin {
      width:44px; height:44px;
      border:3px solid #1e293b; border-top-color:#6366f1;
      border-radius:50%; animation:spin 1s linear infinite;
    }
    @keyframes spin { to { transform:rotate(360deg); } }

    #overlay h2 {
      font-family:-apple-system,BlinkMacSystemFont,sans-serif;
      font-size:1.05rem; font-weight:600; color:#94a3b8;
    }
    #overlay p {
      font-family:-apple-system,BlinkMacSystemFont,sans-serif;
      font-size:0.82rem; color:#64748b; text-align:center;
      line-height:1.6; max-width:300px;
    }
    #overlay p strong { color:#cbd5e1; }

    /* Debug panel — visible before video streams to diagnose any OBS connection issues */
    #debug {
      position:fixed; bottom:0; left:0; right:0;
      background:rgba(3,7,18,0.88); backdrop-filter:blur(6px);
      padding:8px 14px; font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
      font-size:11px; display:flex; flex-direction:column; gap:3px;
      border-top:1px solid rgba(255,255,255,0.08); z-index:20;
    }
    #debug.hidden { display:none; }
    .dl { color:#64748b; display:flex; gap:6px; }
    .dl span { color:#94a3b8; }
    .dl span.ok   { color:#10b981; font-weight:600; }
    .dl span.err  { color:#ef4444; font-weight:600; }
    .dl span.warn { color:#f59e0b; font-weight:600; }
  </style>
</head>
<body>
<video id="video" autoplay playsinline muted></video>

<div id="overlay">
  <div class="spin"></div>
  <h2 id="overlayTitle">Connecting to PeerJS…</h2>
  <p id="overlayMsg">Waiting for camera.<br/>Open <strong>camera.html</strong> on iPhone and tap <strong>Start Streaming</strong>.</p>
</div>

<!-- Diagnostics panel: auto-hides once stream is playing -->
<div id="debug">
  <div class="dl">PeerJS: <span id="dPeer">initializing…</span></div>
  <div class="dl">Session: <span id="dSession">-</span></div>
  <div class="dl">Viewer ID: <span id="dId">-</span></div>
  <div class="dl">Camera Link: <span id="dCall">waiting</span></div>
  <div class="dl">Stream: <span id="dStream">none</span></div>
</div>

<script>
  const params    = new URLSearchParams(location.search);
  const sessionId = params.get('s');
  const isPreview = params.get('preview') === '1';

  // ── Debug helpers ──────────────────────────────────────────────────────────
  function dbSet(id, text, state) {
    const el = document.getElementById(id);
    if (!el) return;
    el.textContent = text;
    el.className = state || '';
  }

  function setOverlay(title, msg) {
    document.getElementById('overlayTitle').textContent = title;
    document.getElementById('overlayMsg').innerHTML = msg;
    document.getElementById('overlay').classList.remove('hidden');
  }


  // ── Peer IDs ───────────────────────────────────────────────────────────────
  // Camera has fixed ID: ipcam-c-{session}
  // Each viewer gets a unique random suffix to completely prevent ID collisions
  // between OBS, control panel preview iframe, or scene refreshes.
  const uniqueTag      = isPreview ? `prev-${Math.random().toString(36).substring(2, 7)}` : `obs-${Math.random().toString(36).substring(2, 7)}`;
  const VIEWER_PEER_ID = `ipcam-v-${sessionId}-${uniqueTag}`;
  const CAMERA_PEER_ID = `ipcam-c-${sessionId}`;

  const PEER_CFG = {
    host: '0.peerjs.com', port: 443, path: '/', secure: true, debug: 0,
    config: {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'stun:stun2.l.google.com:19302' },
        { urls: 'stun:stun3.l.google.com:19302' },
        { urls: 'stun:stun4.l.google.com:19302' },
        { urls: 'stun:global.stun.twilio.com:3478' }
      ]
    }
  };

  let bc = null;
  try { bc = new BroadcastChannel('ipcam-status'); } catch(_) {}

  var viewerPeer     = null;
  let activeCall     = null;
  let dataConn       = null;
  let pingInterval   = null;
  let isStreaming    = false;

  function startViewer() {
    if (viewerPeer && !viewerPeer.destroyed) {
      try { viewerPeer.destroy(); } catch(_) {}
    }

    dbSet('dPeer', 'connecting to cloud server…', 'warn');
    dbSet('dId', VIEWER_PEER_ID);

    viewerPeer = new Peer(VIEWER_PEER_ID, PEER_CFG);

    viewerPeer.on('open', (id) => {
      console.log('[Viewer] Registered with PeerJS as:', id);
      dbSet('dPeer', '✓ online', 'ok');
      dbSet('dId', id, 'ok');
      dbSet('dCall', 'locating iPhone camera…', 'warn');
      setOverlay('Waiting for camera…', 'Open camera on iPhone and tap <strong>Start Streaming</strong>.');

      // Start pinging camera to request stream
      connectToCamera();
      clearInterval(pingInterval);
      pingInterval = setInterval(() => {
        if (!isStreaming) {
          connectToCamera();
        }
      }, 3000);
    });

    // ── Incoming Media Call from Camera ──────────────────────────────────────
    viewerPeer.on('call', (call) => {
      console.log('[Viewer] Incoming call from camera:', call.peer);
      dbSet('dCall', 'incoming call from camera…', 'warn');

      if (activeCall) {
        try { activeCall.close(); } catch(_) {}
      }
      activeCall = call;

      // Answer cleanly without providing any dummy stream.
      // In WebRTC & PeerJS, the viewer is receiver-only.
      call.answer();

      call.on('stream', (remoteStream) => {
        console.log('[Viewer] Received remote stream with tracks:', remoteStream.getTracks().length);
        isStreaming = true;
        dbSet('dStream', `live (${remoteStream.getVideoTracks().length} video track)`, 'ok');
        dbSet('dCall', 'streaming live ✓', 'ok');

        const vid = document.getElementById('video');
        vid.muted = true;
        vid.defaultMuted = true;
        vid.playsInline = true;
        vid.srcObject = remoteStream;

        const onStartPlay = () => {
          document.getElementById('overlay').classList.add('hidden');
          document.getElementById('debug').classList.add('hidden');
          bc?.postMessage({ type: 'live' });
        };

        vid.onloadedmetadata = () => {
          const track = remoteStream.getVideoTracks()[0];
          const settings = track ? track.getSettings() : {};
          const resText = (settings.width && settings.height) ? `${settings.width}×${settings.height}` : 'HD';
          dbSet('dStream', `live (${resText})`, 'ok');
          vid.play().then(onStartPlay).catch(e => console.warn('[Viewer] vid.play():', e));
        };

        vid.play().then(onStartPlay).catch(e => {
          console.warn('[Viewer] Autoplay catch:', e);
        });
      });

      call.on('close', () => {
        console.log('[Viewer] Call closed');
        handleStreamStopped('Camera stopped stream');
      });

      call.on('error', (err) => {
        console.warn('[Viewer] Call error:', err);
        handleStreamStopped('Stream interrupted, retrying…');
      });
    });

    viewerPeer.on('error', (err) => {
      console.warn('[Viewer] Peer error:', err.type, err.message);
      if (err.type === 'unavailable-id') {
        dbSet('dPeer', 'ID busy, retrying…', 'warn');
        setTimeout(startViewer, 2000);
      } else if (err.type === 'peer-unavailable') {
        // Camera is not yet online or user has not tapped Start Streaming yet
        dbSet('dPeer', '✓ online', 'ok');
        dbSet('dCall', 'waiting for camera…', 'warn');
      } else if (['network', 'server-error', 'socket-error', 'socket-closed'].includes(err.type)) {
        dbSet('dPeer', 'server reconnecting…', 'warn');
        setTimeout(() => {
          if (viewerPeer && !viewerPeer.destroyed) viewerPeer.reconnect();
        }, 3000);
      } else {
        dbSet('dPeer', err.type, 'err');
      }
    });

    viewerPeer.on('disconnected', () => {
      dbSet('dPeer', 'disconnected, reconnecting…', 'warn');
      setTimeout(() => {
        if (viewerPeer && !viewerPeer.destroyed) viewerPeer.reconnect();
      }, 2000);
    });
  }

  // ── Connect / Ping Camera via PeerJS Data Connection ──────────────────────
  function connectToCamera() {
    if (isStreaming) return;
    if (!viewerPeer || viewerPeer.destroyed || viewerPeer.disconnected) return;

    try {
      if (dataConn && dataConn.open) {
        dataConn.send('request-stream');
        return;
      }

      if (dataConn) {
        try { dataConn.close(); } catch(_) {}
        dataConn = null;
      }

      dataConn = viewerPeer.connect(CAMERA_PEER_ID, { reliable: true });

      dataConn.on('open', () => {
        console.log('[Viewer] Data channel opened to camera');
        dbSet('dCall', 'camera linked, requesting stream…', 'ok');
        dataConn.send('request-stream');
      });

      dataConn.on('data', (msg) => {
        console.log('[Viewer] Message from camera:', msg);
      });

      dataConn.on('close', () => {
        dataConn = null;
        if (!isStreaming) {
          dbSet('dCall', 'searching for camera…', 'warn');
        }
      });

      dataConn.on('error', (err) => {
        dataConn = null;
      });
    } catch(e) {
      console.warn('[Viewer] connectToCamera exception:', e);
    }
  }

  function handleStreamStopped(msg) {
    isStreaming = false;
    const vid = document.getElementById('video');
    vid.srcObject = null;
    document.getElementById('overlay').classList.remove('hidden');
    document.getElementById('debug').classList.remove('hidden');
    dbSet('dCall', 'waiting for camera…', 'warn');
    dbSet('dStream', 'none');
    setOverlay(msg || 'Camera stopped…', 'Tap <strong>Start Streaming</strong> on iPhone to resume.');
    bc?.postMessage({ type: 'waiting' });
    activeCall = null;
  }

  // ── Startup ────────────────────────────────────────────────────────────────
  if (!sessionId) {
    setOverlay('Missing Session ID', 'Please add <code>?s=YOUR_SESSION_ID</code> or copy the OBS URL from the control panel.');
    dbSet('dSession', 'MISSING', 'err');
    dbSet('dPeer', 'aborted', 'err');
  } else {
    dbSet('dSession', sessionId);
    startViewer();
  }
</script>
</body>
</html>
